<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Premium - Meninas</title>
    <style>
        :root {
            --bg-body: #141414;
            --bg-container: #ffffff;
            --cor-texto: #333333;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-body); 
            color: white; margin: 0; transition: 0.4s;
        }

        /* --- TELA DE PERFIS --- */
        #tela-perfis {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }

        .perfis-container { display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        .perfil-card { cursor: pointer; text-align: center; width: 120px; transition: 0.3s; }
        .perfil-card:hover { transform: scale(1.1); }
        
        .avatar {
            width: 120px; height: 120px; border-radius: 8px;
            background-size: cover; background-position: center;
            border: 3px solid transparent; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 40px;
            background-color: #333;
        }
        .perfil-card:hover .avatar { border-color: white; }

        /* --- INTERFACE PRINCIPAL --- */
        #interface-principal { display: none; }
        
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: rgba(0,0,0,0.8);
        }

        .nav-links button {
            background: none; border: none; color: #aaa; margin-left: 15px;
            cursor: pointer; font-size: 1em; font-weight: bold;
        }
        .nav-links button:hover { color: white; }

        .container {
            max-width: 480px; margin: 30px auto; background: var(--bg-container);
            padding: 25px; border-radius: 12px; color: var(--cor-texto);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        section { display: none; }
        section.active { display: block; }

        input, textarea { padding: 12px; width: 90%; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        button.btn-acao { 
            padding: 12px; background: #e50914; color: white; 
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;
        }

        .item-vencimento {
            padding: 15px; margin: 10px 0; border-radius: 8px;
            border-left: 8px solid #ddd; background: #f9f9f9;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .vencido { background-color: #ffcccc !important; border-left-color: #ff0000 !important; }
        .alerta-laranja { background-color: #ffedcc !important; border-left-color: #ffa500 !important; }

        .btn-zerar { background: #666 !important; margin-top: 20px; }
        .btn-voltar { background: #333; color: white; border: none; padding: 10px 15px; cursor: pointer; margin: 10px; border-radius: 5px; font-weight: bold; }
        
        .sub-item { font-size: 0.9em; padding: 5px; border-bottom: 1px dashed #ccc; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="tela-perfis">
        <h1 style="font-size: 2.5em;">Quem está usando?</h1>
        <div class="perfis-container" id="lista-avatars"></div>
    </div>

    <div id="interface-principal">
        <button class="btn-voltar" onclick="location.reload()">← Trocar Usuário</button>
        
        <nav class="navbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div id="mini-avatar" style="width:45px; height:45px; border-radius:50%; background-size:cover; background-position:center; background-color:#444;"></div>
                <h2 id="user-display" style="margin:0"></h2>
            </div>
            <div class="nav-links">
                <button onclick="aba('gastos')">Gastos</button>
                <button onclick="aba('vencimentos')">Vencimentos</button>
                <button onclick="aba('pedidos')">📦 Pedidos</button>
                <button onclick="aba('ajustes')">Ajustes</button>
            </div>
        </nav>

        <section id="gastos" class="container active">
            <h2>Meus Gastos</h2>
            <div id="financeiro-ok">
                <p>Meta: R$ <span id="valMeta">0</span></p>
                <input type="number" id="inGasto" placeholder="Valor do gasto">
                <button class="btn-acao" onclick="addGasto()">Registrar</button>
                <div style="margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px;">
                    <p>Total: <span id="totalG">0</span> | Restante: <b id="restaG">0</b></p>
                </div>
            </div>
            <div id="financeiro-setup" style="display:none;">
                <input type="number" id="inMeta" placeholder="Definir meta mensal">
                <button class="btn-acao" onclick="setMeta()">Salvar Meta</button>
            </div>
        </section>

        <section id="vencimentos" class="container">
            <h2>Vencimentos</h2>
            <input type="text" id="vNome" placeholder="Produto">
            <div style="display: flex; gap: 5px;">
                <input type="number" id="vQtd" placeholder="Qtd">
                <input type="number" id="vPreco" placeholder="R$">
            </div>
            <input type="date" id="vData">
            <button class="btn-acao" style="background:#007bff" onclick="addVenc()">Adicionar</button>
            <div id="listaV" style="margin-top:15px; color: #333;"></div>
        </section>

        <section id="pedidos" class="container">
            <div id="view-lista-pedidos">
                <h2>📦 Meus Pedidos</h2>
                <button class="btn-acao" style="background:#f39c12; margin-bottom: 15px;" onclick="abrirNovoPedido()">+ Registrar Novo Pedido</button>
                <div id="listaArquivosPedidos" style="color:#333;"></div>
            </div>

            <div id="view-novo-pedido" style="display:none;">
                <button onclick="voltarParaPedidos()" style="background:none; border:none; color:#007bff; cursor:pointer; font-weight:bold; margin-bottom:10px;">← Voltar</button>
                <h3>Novo Pedido</h3>
                <input type="text" id="pEmpresa" placeholder="Empresa (Ex: Coca-Cola)">
                <div style="background:#f9f9f9; padding:10px; border-radius:8px;">
                    <input type="text" id="pProdNome" placeholder="Produto">
                    <input type="number" id="pProdUn" placeholder="Unidades">
                    <button class="btn-acao" style="background:#444;" onclick="addProdNaListaTemp()">+ Incluir Produto</button>
                </div>
                <div id="listaTempProd" style="margin-top:15px; font-size:0.9em; color:#333;"></div>
                <button class="btn-acao" style="background:#27ae60" onclick="salvarPedidoFinal()">Finalizar Pedido</button>
            </div>
        </section>

        <section id="ajustes" class="container">
            <h2>Ajustes</h2>
            <label>Foto de Perfil (URL):</label>
            <input type="text" id="cfgFoto" placeholder="Link da imagem">
            <button class="btn-acao" style="background:#444" onclick="salvarFoto()">Atualizar Foto</button>
            <hr style="margin: 20px 0; opacity: 0.1;">
            <label>Cores do Painel:</label><br>
            Fundo: <input type="color" id="cfgBg" onchange="salvarCores()"> 
            Card: <input type="color" id="cfgCard" onchange="salvarCores()">
            <button class="btn-acao btn-zerar" onclick="zerarDados()">Zerar Gastos</button>
        </section>
    </div>

    <script>
        let logado = "";
        let listaProdutosTemporaria = [];
        const DB_KEY = 'casaDB_vFinal_BackupSystem';

        let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
            perfis: {
                "Brena": { meta: 0, gastos: 0, foto: "", cores: { bg: "#141414", card: "#ffffff" } },
                "Yara": { meta: 0, gastos: 0, foto: "", cores: { bg: "#141414", card: "#ffffff" } },
                "Nathalia": { meta: 0, gastos: 0, foto: "", cores: { bg: "#141414", card: "#ffffff" } }
            },
            vencimentos: [],
            historicoEntregas: []
        };

        function renderPerfis() {
            const container = document.getElementById('lista-avatars');
            container.innerHTML = "";
            Object.keys(db.perfis).forEach(p => {
                const foto = db.perfis[p].foto;
                container.innerHTML += `
                    <div class="perfil-card" onclick="entrar('${p}')">
                        <div class="avatar" style="background-image: url('${foto}');">${foto ? '' : p[0]}</div>
                        <span style="font-weight:bold;">${p}</span>
                    </div>`;
            });
        }

        function entrar(nome) {
            logado = nome;
            document.getElementById('tela-perfis').style.display = 'none';
            document.getElementById('interface-principal').style.display = 'block';
            document.getElementById('user-display').innerText = nome;
            atualizarMiniAvatar();
            aplicarCores();
            aba('gastos');
        }

        function aba(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'gastos') renderFinanceiro();
            if(id === 'vencimentos') renderVenc();
            if(id === 'pedidos') { voltarParaPedidos(); renderArquivosPedidos(); }
            if(id === 'ajustes') carregarAjustes();
        }

        function renderFinanceiro() {
            const p = db.perfis[logado];
            if(p.meta === 0) {
                document.getElementById('financeiro-ok').style.display = 'none';
                document.getElementById('financeiro-setup').style.display = 'block';
            } else {
                document.getElementById('financeiro-ok').style.display = 'block';
                document.getElementById('financeiro-setup').style.display = 'none';
                document.getElementById('valMeta').innerText = p.meta.toFixed(2);
                document.getElementById('totalG').innerText = `R$ ${p.gastos.toFixed(2)}`;
                document.getElementById('restaG').innerText = `R$ ${(p.meta - p.gastos).toFixed(2)}`;
            }
        }
        function setMeta() {
            const m = parseFloat(document.getElementById('inMeta').value);
            if(m > 0) { db.perfis[logado].meta = m; salvar(); renderFinanceiro(); }
        }
        function addGasto() {
            const v = parseFloat(document.getElementById('inGasto').value);
            if(v > 0) { db.perfis[logado].gastos += v; salvar(); renderFinanceiro(); document.getElementById('inGasto').value = ''; }
        }

        function addVenc() {
            const n = document.getElementById('vNome').value;
            const q = parseInt(document.getElementById('vQtd').value) || 0;
            const p = parseFloat(document.getElementById('vPreco').value) || 0;
            const d = document.getElementById('vData').value;
            if(n && d) { db.vencimentos.push({ n, q, p, d }); salvar(); renderVenc(); }
        }
        function renderVenc() {
            const lista = document.getElementById('listaV');
            lista.innerHTML = "";
            const hoje = new Date();
            db.vencimentos.sort((a,b) => new Date(a.d) - new Date(b.d));
            db.vencimentos.forEach((it, i) => {
                const dataV = new Date(it.d);
                const diff = Math.ceil((dataV - hoje) / (1000 * 60 * 60 * 24));
                let classe = diff <= 10 ? "vencido" : (diff <= 15 ? "alerta-laranja" : "");
                lista.innerHTML += `<div class="item-vencimento ${classe}"><span><b>${it.n}</b> (${it.q} un)<br><small>R$ ${it.p.toFixed(2)} | Venc: ${it.d.split('-').reverse().join('/')}</small></span><button onclick="delV(${i})" style="background:none; border:none; cursor:pointer;">❌</button></div>`;
            });
        }
        function delV(i) { db.vencimentos.splice(i,1); salvar(); renderVenc(); }

        function abrirNovoPedido() {
            document.getElementById('view-lista-pedidos').style.display = 'none';
            document.getElementById('view-novo-pedido').style.display = 'block';
            listaProdutosTemporaria = [];
            renderListaTemp();
        }
        function voltarParaPedidos() {
            document.getElementById('view-lista-pedidos').style.display = 'block';
            document.getElementById('view-novo-pedido').style.display = 'none';
        }
        function addProdNaListaTemp() {
            const nome = document.getElementById('pProdNome').value;
            const un = document.getElementById('pProdUn').value;
            if(nome && un) {
                listaProdutosTemporaria.push({ nome, un });
                document.getElementById('pProdNome').value = "";
                document.getElementById('pProdUn').value = "";
                renderListaTemp();
            }
        }
        function renderListaTemp() {
            const lista = document.getElementById('listaTempProd');
            lista.innerHTML = listaProdutosTemporaria.length > 0 ? "<b>Lista:</b><br>" : "";
            listaProdutosTemporaria.forEach((p) => {
                lista.innerHTML += `<div class="sub-item">${p.nome} <span>${p.un} un</span></div>`;
            });
        }
        function salvarPedidoFinal() {
            const empresa = document.getElementById('pEmpresa').value;
            if(empresa && listaProdutosTemporaria.length > 0) {
                db.historicoEntregas.unshift({ empresa, produtos: listaProdutosTemporaria, data: new Date().toLocaleDateString('pt-BR'), quem: logado, expandido: false });
                salvar(); voltarParaPedidos(); renderArquivosPedidos();
                document.getElementById('pEmpresa').value = "";
            }
        }
        function renderArquivosPedidos() {
            const lista = document.getElementById('listaArquivosPedidos');
            lista.innerHTML = "";
            db.historicoEntregas.forEach((p, i) => {
                const display = p.expandido ? "block" : "none";
                const seta = p.expandido ? "▲" : "▼";
                let prodHtml = p.produtos.map(pr => `<div class="sub-item">${pr.nome} <span>${pr.un} un</span></div>`).join("");
                lista.innerHTML += `
                <div class="item-vencimento" style="border-left-color:#f39c12; flex-direction:column; align-items:flex-start;">
                    <div style="display:flex; justify-content:space-between; width:100%; cursor:pointer;" onclick="togglePedido(${i})">
                        <b>${p.empresa}</b> <span><small>${p.data}</small> ${seta}</span>
                    </div>
                    <div style="display:${display}; width:100%; margin-top:10px; background:#fff; padding:5px; border-radius:4px;">
                        ${prodHtml}
                        <div style="margin-top:10px; font-size:0.7em; color:#666;">Por: ${p.quem} | <span onclick="delHistorico(${i})" style="color:red; cursor:pointer;">Excluir</span></div>
                    </div>
                </div>`;
            });
        }
        function togglePedido(i) { db.historicoEntregas[i].expandido = !db.historicoEntregas[i].expandido; renderArquivosPedidos(); }
        function delHistorico(i) { if(confirm("Excluir?")) { db.historicoEntregas.splice(i, 1); salvar(); renderArquivosPedidos(); } }

        function carregarAjustes() { document.getElementById('cfgFoto').value = db.perfis[logado].foto; }
        function salvarFoto() { db.perfis[logado].foto = document.getElementById('cfgFoto').value; salvar(); atualizarMiniAvatar(); alert("Foto OK!"); }
        function atualizarMiniAvatar() {
            const f = db.perfis[logado].foto;
            const m = document.getElementById('mini-avatar');
            m.style.backgroundImage = f ? `url('${f}')` : "none";
            m.innerText = f ? "" : logado[0];
        }
        function salvarCores() { 
            db.perfis[logado].cores.bg = document.getElementById('cfgBg').value; 
            db.perfis[logado].cores.card = document.getElementById('cfgCard').value; 
            salvar(); aplicarCores(); 
        }
        function aplicarCores() { 
            const c = db.perfis[logado].cores; 
            document.body.style.backgroundColor = c.bg; 
            document.documentElement.style.setProperty('--bg-container', c.card); 
        }
        function zerarDados() { if(confirm("Zerar gastos?")) { db.perfis[logado].meta = 0; db.perfis[logado].gastos = 0; salvar(); renderFinanceiro(); } }
        function salvar() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
        window.onload = renderPerfis;
    </script>
</body>
</html>
