<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Premium</title>
    <style>
        :root { --bg-body: #141414; --bg-container: #ffffff; --cor-texto: #333333; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-body); color: white; margin: 0; transition: 0.4s; }
        
        /* --- TELA DE PERFIS --- */
        #tela-perfis { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .perfis-container { display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        .perfil-card { cursor: pointer; text-align: center; width: 120px; transition: 0.3s; }
        .avatar { width: 120px; height: 120px; border-radius: 8px; background-size: cover; background-position: center; background-color: #333; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 10px; border: 3px solid transparent; }
        .perfil-card:hover .avatar { border-color: white; }

        /* --- INTERFACE --- */
        #interface-principal { display: none; }
        .btn-voltar { background: #333; color: white; border: none; padding: 10px 15px; cursor: pointer; margin: 10px; border-radius: 5px; font-weight: bold; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 100; }
        .nav-links button { background: none; border: none; color: #aaa; margin-left: 15px; cursor: pointer; font-weight: bold; }
        .nav-links button.active { color: white; border-bottom: 2px solid #e50914; }

        .container { max-width: 480px; margin: 20px auto; background: var(--bg-container); padding: 25px; border-radius: 12px; color: var(--cor-texto); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        section { display: none; }
        section.active { display: block; }

        input, select { padding: 12px; width: 100%; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button.btn-acao { padding: 12px; background: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }

        .item-vencimento { padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 8px solid #ddd; background: #f9f9f9; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); color: #333; }
        .urgente { border: 2px solid #e50914; position: relative; }
        .urgente::before { content: "⚠️ PRIORIDADE"; position: absolute; top: -10px; left: 10px; background: #e50914; color: white; font-size: 0.7em; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
        .vencido { background-color: #ffcccc !important; border-left-color: #ff0000 !important; }
        .alerta-laranja { background-color: #ffedcc !important; border-left-color: #ffa500 !important; }

        .sugestao-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; position: relative; }
        .btn-limpar-sugestao { background: #666; color: white; border: none; padding: 5px 10px; font-size: 0.7em; cursor: pointer; border-radius: 3px; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

    <div id="tela-perfis">
        <h1>Quem está usando?</h1>
        <div class="perfis-container" id="lista-avatars"></div>
    </div>

    <div id="interface-principal">
        <button class="btn-voltar" onclick="location.reload()">← Trocar Usuário</button>
        <nav class="navbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div id="mini-avatar" style="width:40px; height:40px; border-radius:50%; background-size:cover; background-position:center; background-color:#444;"></div>
                <h2 id="user-display" style="margin:0; font-size: 1.1em;"></h2>
            </div>
            <div class="nav-links">
                <button id="btn-gastos" onclick="aba('gastos')">Gastos</button>
                <button id="btn-pedidos" onclick="aba('pedidos')">Pedidos</button>
                <button id="btn-vencimentos" onclick="aba('vencimentos')">Vencimentos</button>
                <button id="btn-ajustes" onclick="aba('ajustes')">Ajustes</button>
            </div>
        </nav>

        <section id="gastos" class="container">
            <h2>Meus Gastos</h2>
            <div id="financeiro-ok">
                <p>Meta Mensal: <b>R$ <span id="valMeta">0</span></b></p>
                <input type="number" id="inGasto" placeholder="Valor do gasto (R$)">
                <button class="btn-acao" onclick="addGasto()">Registrar Gasto</button>
                <div style="margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px;">
                    <p>Total Gasto: <span id="totalG">R$ 0,00</span></p>
                    <p>Restante: <b id="restaG">R$ 0,00</b></p>
                </div>
            </div>
            <div id="financeiro-setup" style="display:none;">
                <input type="number" id="inMeta" placeholder="Definir meta mensal (R$)">
                <button class="btn-acao" onclick="setMeta()">Salvar Meta</button>
            </div>
        </section>

        <section id="pedidos" class="container">
            <h2>📦 Pedidos</h2>
            <select id="selEmpresa" onchange="gerarSugestao()"><option value="">Selecione a Empresa...</option></select>
            <div id="areaSugestao"></div>
            <button class="btn-acao" style="background:#f39c12; margin-top: 20px;" onclick="document.getElementById('view-novo-pedido').style.display='block'">+ Cadastrar Padrão de Pedido</button>
            <div id="view-novo-pedido" style="display:none; margin-top:15px; border-top:1px solid #ddd; padding-top:10px;">
                <input type="text" id="pProdNome" placeholder="Produto">
                <input type="number" id="pProdUn" placeholder="Meta de estoque">
                <button class="btn-acao" style="background:#444" onclick="addItemTemp()">Incluir Item</button>
                <div id="listaTemp" style="margin:10px 0"></div>
                <button class="btn-acao" style="background:#27ae60" onclick="salvarPedidoFinal()">Salvar Padrão</button>
            </div>
        </section>

        <section id="vencimentos" class="container">
            <h2>⚠️ Vencimentos da Casa</h2>
            <input type="text" id="vNome" placeholder="Nome do Produto">
            <div style="display: flex; gap: 5px;">
                <input type="number" id="vQtd" placeholder="Qtd">
                <input type="number" id="vPreco" placeholder="Preço (R$)">
            </div>
            <input type="date" id="vData">
            <button class="btn-acao" style="background:#007bff" onclick="addVenc()">Adicionar Item</button>
            <div id="listaV" style="margin-top:15px;"></div>
        </section>

        <section id="ajustes" class="container">
            <h2>Ajustes</h2>
            <input type="text" id="cfgFoto" placeholder="URL da Foto">
            <button class="btn-acao" style="background:#444" onclick="salvarFoto()">Salvar Foto Perfil</button>
            <div style="margin:15px 0">
                Fundo: <input type="color" id="cfgBg" onchange="salvarCores()"> 
                Card: <input type="color" id="cfgCard" onchange="salvarCores()">
            </div>
            <hr>
            <input type="text" id="newEmpresa" placeholder="Nova Empresa">
            <button class="btn-acao" style="background:#2ecc71" onclick="addEmpresa()">Cadastrar Empresa</button>
            <div id="listaEmpresasExcluir" style="margin-top:10px;"></div>
            <hr>
            <button class="btn-acao" style="background:#666; margin-top:20px" onclick="zerarDados()">Zerar Meta e Gastos</button>
        </section>
    </div>

<script>
    let logado = "";
    let listaTemp = [];
    const DB_KEY = 'casa_premium_v_final';

    let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
        perfis: {
            "Brena": { meta: 0, gastos: 0, foto: "", cores: { bg: "#141414", card: "#ffffff" } },
            "Yara": { meta: 0, gastos: 0, foto: "", cores: { bg: "#141414", card: "#ffffff" } },
            "Nathalia": { meta: 0, gastos: 0, foto: "", cores: { bg: "#141414", card: "#ffffff" } }
        },
        empresas: ["Coca-Cola"],
        pedidosPadrao: {},
        vencimentos: []
    };

    function renderPerfis() {
        const container = document.getElementById('lista-avatars');
        container.innerHTML = "";
        Object.keys(db.perfis).forEach(p => {
            const foto = db.perfis[p].foto;
            container.innerHTML += `<div class="perfil-card" onclick="entrar('${p}')"><div class="avatar" style="background-image: url('${foto}')">${foto?'':p[0]}</div><b>${p}</b></div>`;
        });
    }

    function entrar(nome) {
        logado = nome;
        document.getElementById('tela-perfis').style.display = 'none';
        document.getElementById('interface-principal').style.display = 'block';
        document.getElementById('user-display').innerText = nome;
        aplicarCores(); atualizarMiniAvatar(); aba('gastos');
    }

    function aba(id) {
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        const btn = document.getElementById('btn-' + id);
        if(btn) btn.classList.add('active');
        if(id === 'gastos') renderFinanceiro();
        if(id === 'vencimentos') renderVenc();
        if(id === 'ajustes') carregarAjustes();
        if(id === 'pedidos') popularEmpresas();
    }

    function renderFinanceiro() {
        const p = db.perfis[logado];
        if(p.meta === 0) {
            document.getElementById('financeiro-ok').style.display = 'none';
            document.getElementById('financeiro-setup').style.display = 'block';
        } else {
            document.getElementById('financeiro-ok').style.display = 'block';
            document.getElementById('financeiro-setup').style.display = 'none';
            document.getElementById('valMeta').innerText = p.meta.toFixed(2);
            document.getElementById('totalG').innerText = `R$ ${p.gastos.toFixed(2)}`;
            document.getElementById('restaG').innerText = `R$ ${(p.meta - p.gastos).toFixed(2)}`;
        }
    }
    function setMeta() { const m = parseFloat(document.getElementById('inMeta').value); if(m > 0) { db.perfis[logado].meta = m; salvar(); renderFinanceiro(); } }
    function addGasto() { const v = parseFloat(document.getElementById('inGasto').value); if(v > 0) { db.perfis[logado].gastos += v; salvar(); renderFinanceiro(); document.getElementById('inGasto').value=''; } }
    function zerarDados() { if(confirm("Zerar meta e gastos?")) { db.perfis[logado].meta = 0; db.perfis[logado].gastos = 0; salvar(); renderFinanceiro(); } }

    // --- PEDIDOS ---
    function popularEmpresas() {
        const sel = document.getElementById('selEmpresa');
        sel.innerHTML = '<option value="">Selecione a Empresa...</option>';
        db.empresas.forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
    }
    function addItemTemp() {
        const n = document.getElementById('pProdNome').value;
        const u = document.getElementById('pProdUn').value;
        if(n && u) { listaTemp.push({nome: n, un: parseInt(u)}); renderTemp(); }
    }
    function renderTemp() { document.getElementById('listaTemp').innerHTML = listaTemp.map(i => `<div>${i.nome} (${i.un})</div>`).join(""); }
    function salvarPedidoFinal() {
        const emp = document.getElementById('selEmpresa').value;
        if(!emp) return alert("Selecione a empresa");
        db.pedidosPadrao[emp] = [...listaTemp];
        listaTemp = []; salvar(); document.getElementById('view-novo-pedido').style.display='none'; gerarSugestao();
    }
    function gerarSugestao() {
        const emp = document.getElementById('selEmpresa').value;
        const area = document.getElementById('areaSugestao');
        if(!emp || !db.pedidosPadrao[emp] || db.pedidosPadrao[emp].length === 0) { area.innerHTML = ""; return; }
        let html = `<div class="sugestao-box"><strong>Sugestão ${emp}:</strong><br>`;
        db.pedidosPadrao[emp].forEach((it, idx) => {
            html += `<div style="margin:8px 0">${it.nome} (Meta: ${it.un})<br>Tenho: <input type="number" style="width:50px" oninput="document.getElementById('r_${idx}').innerText = Math.max(0, ${it.un} - this.value)"> -> Pedir: <b id="r_${idx}">${it.un}</b></div>`;
        });
        html += `<button class="btn-limpar-sugestao" onclick="excluirSugestao('${emp}')">Excluir Padrão de Pedido</button>`;
        area.innerHTML = html + "</div>";
    }
    function excluirSugestao(emp) {
        if(confirm(`Excluir todos os itens salvos para ${emp}?`)) {
            delete db.pedidosPadrao[emp];
            salvar(); gerarSugestao();
        }
    }

    // --- VENCIMENTOS ---
    function addVenc() {
        const n = document.getElementById('vNome').value;
        const q = parseInt(document.getElementById('vQtd').value) || 0;
        const p = parseFloat(document.getElementById('vPreco').value) || 0;
        const d = document.getElementById('vData').value;
        if(n && d) { db.vencimentos.push({ n, q, p, d }); salvar(); renderVenc(); }
    }
    function renderVenc() {
        const lista = document.getElementById('listaV');
        lista.innerHTML = "";
        const hoje = new Date();
        db.vencimentos.sort((a,b) => new Date(a.d) - new Date(b.d));
        db.vencimentos.forEach((it, i) => {
            const dataV = new Date(it.d);
            const diff = Math.ceil((dataV - hoje) / (1000 * 60 * 60 * 24));
            let classe = "";
            if (diff <= 10) classe = "vencido";
            else if (diff <= 15) classe = "alerta-laranja";
            if (classe === "") {
                if (it.p < 5 && it.q < 15) classe = "alerta-laranja";
                if (it.p > 5 && it.q === 15 && diff <= 15) classe = "alerta-laranja";
            }
            const destaque = (i === 0 && diff <= 15) ? "urgente" : "";
            lista.innerHTML += `
                <div class="item-vencimento ${classe} ${destaque}">
                    <span><b>${it.n}</b> (${it.q} un)<br>
                    <small>R$ ${it.p.toFixed(2)} | Venc: ${it.d.split('-').reverse().join('/')}</small></span>
                    <button onclick="delV(${i})" style="background:none; border:none; cursor:pointer;">❌</button>
                </div>`;
        });
    }
    function delV(i) { db.vencimentos.splice(i,1); salvar(); renderVenc(); }

    // --- AJUSTES ---
    function carregarAjustes() {
        const p = db.perfis[logado];
        document.getElementById('cfgFoto').value = p.foto;
        document.getElementById('cfgBg').value = p.cores.bg;
        document.getElementById('cfgCard').value = p.cores.card;
        
        const list = document.getElementById('listaEmpresasExcluir');
        list.innerHTML = "<strong>Empresas Cadastradas:</strong><br>";
        db.empresas.forEach((e, i) => {
            list.innerHTML += `<div style='display:flex; justify-content:space-between; margin-top:5px;'>${e} <button onclick='excluirEmpresa(${i})' style='color:red; background:none; border:none; cursor:pointer'>Excluir</button></div>`;
        });
    }
    function salvarFoto() { db.perfis[logado].foto = document.getElementById('cfgFoto').value; salvar(); atualizarMiniAvatar(); alert("Foto atualizada!"); }
    function salvarCores() {
        db.perfis[logado].cores.bg = document.getElementById('cfgBg').value;
        db.perfis[logado].cores.card = document.getElementById('cfgCard').value;
        salvar(); aplicarCores();
    }
    function aplicarCores() {
        const c = db.perfis[logado].cores;
        document.body.style.backgroundColor = c.bg;
        document.documentElement.style.setProperty('--bg-container', c.card);
    }
    function atualizarMiniAvatar() {
        const f = db.perfis[logado].foto;
        const m = document.getElementById('mini-avatar');
        m.style.backgroundImage = f ? `url('${f}')` : "none";
        m.innerText = f ? "" : logado[0];
        m.style.display = "flex"; m.style.alignItems = "center"; m.style.justifyContent = "center"; m.style.color = "white"; m.style.fontWeight = "bold";
    }
    function addEmpresa() { const e = document.getElementById('newEmpresa').value; if(e) { db.empresas.push(e); salvar(); carregarAjustes(); document.getElementById('newEmpresa').value = ""; } }
    function excluirEmpresa(i) { if(confirm("Remover esta empresa?")) { db.empresas.splice(i,1); salvar(); carregarAjustes(); } }
    function salvar() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    window.onload = renderPerfis;
</script>
</body>
</html>
