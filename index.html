<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Premium - Meninas</title>
    <style>
        :root {
            --bg-body: #141414;
            --bg-container: #ffffff;
            --cor-texto: #333333;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-body); 
            color: white; margin: 0; transition: 0.4s;
        }

        /* --- TELA DE PERFIS --- */
        #tela-perfis {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }

        .perfis-container { display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        .perfil-card { cursor: pointer; text-align: center; width: 120px; transition: 0.3s; }
        .perfil-card:hover { transform: scale(1.1); }
        
        .avatar {
            width: 120px; height: 120px; border-radius: 8px;
            background-size: cover; background-position: center;
            border: 3px solid transparent; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 40px;
            background-color: #333;
        }
        .perfil-card:hover .avatar { border-color: white; }

        /* --- INTERFACE PRINCIPAL --- */
        #interface-principal { display: none; }
        
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: rgba(0,0,0,0.8);
        }

        .nav-links button {
            background: none; border: none; color: #aaa; margin-left: 15px;
            cursor: pointer; font-size: 1em; font-weight: bold;
        }
        .nav-links button:hover { color: white; }

        .container {
            max-width: 480px; margin: 30px auto; background: var(--bg-container);
            padding: 25px; border-radius: 12px; color: var(--cor-texto);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        section { display: none; }
        section.active { display: block; }

        input, textarea { padding: 12px; width: 90%; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        button.btn-acao { 
            padding: 12px; background: #e50914; color: white; 
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;
        }

        /* Itens de Lista */
        .item-vencimento {
            padding: 15px; margin: 10px 0; border-radius: 8px;
            border-left: 8px solid #ddd; background: #f9f9f9;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .urgente { border: 2px solid #e50914; position: relative; }
        .urgente::before { 
            content: "⚠️ PRIORIDADE"; position: absolute; top: -10px; left: 10px; 
            background: #e50914; color: white; font-size: 0.7em; padding: 2px 6px; border-radius: 3px; font-weight: bold;
        }
        
        .vencido { background-color: #ffcccc !important; border-left-color: #ff0000 !important; }
        .alerta-laranja { background-color: #ffedcc !important; border-left-color: #ffa500 !important; }

        .btn-zerar { background: #666 !important; margin-top: 20px; }
        .btn-backup { background: #28a745 !important; }
        .btn-voltar { background: #333; color: white; border: none; padding: 10px 15px; cursor: pointer; margin: 10px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="tela-perfis">
        <h1 style="font-size: 2.5em;">Quem está usando?</h1>
        <div class="perfis-container" id="lista-avatars"></div>
    </div>

    <div id="interface-principal">
        <button class="btn-voltar" onclick="location.reload()">← Trocar Usuário</button>
        
        <nav class="navbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div id="mini-avatar" style="width:45px; height:45px; border-radius:50%; background-size:cover; background-position:center; background-color:#444;"></div>
                <h2 id="user-display" style="margin:0"></h2>
            </div>
            <div class="nav-links">
                <button onclick="aba('gastos')">Gastos</button>
                <button onclick="aba('vencimentos')">Vencimentos</button>
                <button onclick="aba('pedidos')">🚚 Pedidos</button>
                <button onclick="aba('ajustes')">Ajustes</button>
            </div>
        </nav>

        <section id="gastos" class="container active">
            <h2>Meus Gastos</h2>
            <div id="financeiro-ok">
                <p>Meta Mensal: <b>R$ <span id="valMeta">0</span></b></p>
                <input type="number" id="inGasto" placeholder="Valor do gasto (R$)">
                <button class="btn-acao" onclick="addGasto()">Registrar Gasto</button>
                <div style="margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px;">
                    <p style="margin: 5px 0;">Gasto Total: <span id="totalG">0</span></p>
                    <p style="margin: 5px 0;">Restante: <b id="restaG">0</b></p>
                </div>
            </div>
            <div id="financeiro-setup" style="display:none;">
                <p>Olá! Defina sua meta.</p>
                <input type="number" id="inMeta" placeholder="Meta mensal (R$)">
                <button class="btn-acao" onclick="setMeta()">Salvar</button>
            </div>
        </section>

        <section id="vencimentos" class="container">
            <h2>Vencimentos da Casa</h2>
            <input type="text" id="vNome" placeholder="Produto">
            <div style="display: flex; gap: 5px;">
                <input type="number" id="vQtd" placeholder="Qtd">
                <input type="number" id="vPreco" placeholder="R$">
            </div>
            <input type="date" id="vData">
            <button class="btn-acao" style="background:#007bff" onclick="addVenc()">Adicionar</button>
            <div id="listaV" style="margin-top:15px; color: #333;"></div>
        </section>

        <section id="pedidos" class="container">
            <h2>🚚 Registro de Entregas</h2>
            <p style="font-size: 0.8em; color: #666;">Registre o que chegou das empresas hoje.</p>
            <input type="text" id="pEmpresa" placeholder="Empresa (Ex: Coca-Cola)">
            <textarea id="pDetalhes" placeholder="O que chegou? (Ex: 10 fardos 220ml)" style="height: 60px;"></textarea>
            <button class="btn-acao" style="background:#27ae60" onclick="registrarChegada()">Registrar Recebimento</button>
            <div id="listaHistorico" style="margin-top:20px; color:#333;"></div>
        </section>

        <section id="ajustes" class="container">
            <h2>Configurações</h2>
            <input type="text" id="cfgFoto" placeholder="Link da foto de perfil">
            <button class="btn-acao" style="background:#444" onclick="salvarFoto()">Salvar Foto</button>
            <hr style="margin: 20px 0; opacity: 0.2;">
            <button class="btn-acao btn-backup" onclick="exportarDados()">Baixar Backup dos Dados</button>
            <input type="file" id="importFile" style="font-size: 0.8em;" onchange="importarDados(this)">
            <hr style="margin: 20px 0; opacity: 0.2;">
            Fundo: <input type="color" id="cfgBg" onchange="salvarCores()"> 
            Card: <input type="color" id="cfgCard" onchange="salvarCores()">
            <button class="btn-acao btn-zerar" onclick="zerarDados()">Zerar Meus Gastos</button>
        </section>
    </div>

    <script>
        let logado = "";
        const DB_KEY = 'casaDB_vFinal_BackupSystem';

        let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
            perfis: {
                "Brena": { meta: 0, gastos: 0, foto: "", cores: { bg: "#141414", card: "#ffffff" } },
                "Yara": { meta: 0, gastos: 0, foto: "", cores: { bg: "#141414", card: "#ffffff" } },
                "Nathalia": { meta: 0, gastos: 0, foto: "", cores: { bg: "#141414", card: "#ffffff" } }
            },
            vencimentos: [],
            historicoEntregas: []
        };

        function renderPerfis() {
            const container = document.getElementById('lista-avatars');
            container.innerHTML = "";
            Object.keys(db.perfis).forEach(p => {
                const foto = db.perfis[p].foto;
                container.innerHTML += `
                    <div class="perfil-card" onclick="entrar('${p}')">
                        <div class="avatar" style="background-image: url('${foto}');">${foto ? '' : p[0]}</div>
                        <span style="font-weight:bold;">${p}</span>
                    </div>`;
            });
        }

        function entrar(nome) {
            logado = nome;
            document.getElementById('tela-perfis').style.display = 'none';
            document.getElementById('interface-principal').style.display = 'block';
            document.getElementById('user-display').innerText = nome;
            atualizarMiniAvatar();
            aplicarCores();
            aba('gastos');
        }

        function aba(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'gastos') renderFinanceiro();
            if(id === 'vencimentos') renderVenc();
            if(id === 'pedidos') renderHistorico();
            if(id === 'ajustes') carregarAjustes();
        }

        // LÓGICA GASTOS
        function renderFinanceiro() {
            const p = db.perfis[logado];
            if(p.meta === 0) {
                document.getElementById('financeiro-ok').style.display = 'none';
                document.getElementById('financeiro-setup').style.display = 'block';
            } else {
                document.getElementById('financeiro-ok').style.display = 'block';
                document.getElementById('financeiro-setup').style.display = 'none';
                document.getElementById('valMeta').innerText = p.meta.toFixed(2);
                document.getElementById('totalG').innerText = `R$ ${p.gastos.toFixed(2)}`;
                document.getElementById('restaG').innerText = `R$ ${(p.meta - p.gastos).toFixed(2)}`;
            }
        }
        function setMeta() {
            const m = parseFloat(document.getElementById('inMeta').value);
            if(m > 0) { db.perfis[logado].meta = m; salvar(); renderFinanceiro(); }
        }
        function addGasto() {
            const v = parseFloat(document.getElementById('inGasto').value);
            if(v > 0) { db.perfis[logado].gastos += v; salvar(); renderFinanceiro(); document.getElementById('inGasto').value = ''; }
        }

        // LÓGICA VENCIMENTOS
        function addVenc() {
            const n = document.getElementById('vNome').value;
            const q = parseInt(document.getElementById('vQtd').value) || 0;
            const p = parseFloat(document.getElementById('vPreco').value) || 0;
            const d = document.getElementById('vData').value;
            if(n && d) { db.vencimentos.push({ n, q, p, d }); salvar(); renderVenc(); }
        }
        function renderVenc() {
            const lista = document.getElementById('listaV');
            lista.innerHTML = "";
            const hoje = new Date();
            db.vencimentos.sort((a,b) => new Date(a.d) - new Date(b.d));
            db.vencimentos.forEach((it, i) => {
                const dataV = new Date(it.d);
                const diff = Math.ceil((dataV - hoje) / (1000 * 60 * 60 * 24));
                let classe = "";
                if (diff <= 10) classe = "vencido";
                else if (diff <= 15) classe = "alerta-laranja";
                if (classe === "" && ((it.p < 5 && it.q < 15) || (it.p > 5 && it.q === 15 && diff <= 15))) {
                    classe = "alerta-laranja";
                }
                const destaque = (i === 0 && diff <= 15) ? "urgente" : "";
                lista.innerHTML += `<div class="item-vencimento ${classe} ${destaque}"><span><b>${it.n}</b> (${it.q} un)<br><small>R$ ${it.p.toFixed(2)} | Venc: ${it.d.split('-').reverse().join('/')}</small></span><button onclick="delV(${i})" style="background:none; border:none; cursor:pointer;">❌</button></div>`;
            });
        }
        function delV(i) { db.vencimentos.splice(i,1); salvar(); renderVenc(); }

        // LÓGICA ENTREGAS (PEDIDOS)
        function registrarChegada() {
            const empresa = document.getElementById('pEmpresa').value;
            const detalhes = document.getElementById('pDetalhes').value;
            if(empresa && detalhes) {
                if(!db.historicoEntregas) db.historicoEntregas = [];
                db.historicoEntregas.unshift({ quem: logado, empresa, detalhes, data: new Date().toLocaleDateString('pt-BR'), expandido: false });
                salvar(); renderHistorico();
                document.getElementById('pEmpresa').value = ""; document.getElementById('pDetalhes').value = "";
            }
        }
        function renderHistorico() {
            const lista = document.getElementById('listaHistorico');
            lista.innerHTML = "";
            if(!db.historicoEntregas) db.historicoEntregas = [];
            db.historicoEntregas.forEach((p, i) => {
                const display = p.expandido ? "block" : "none";
                const btnTxt = p.expandido ? "Recolher ↑" : "Ler mais...";
                lista.innerHTML += `
                <div class="item-vencimento" style="border-left-color: #27ae60; flex-direction: column; align-items: flex-start;">
                    <div style="display:flex; justify-content: space-between; width: 100%;">
                        <b>${p.empresa}</b> <small>(${p.data})</small>
                        <button onclick="delHistorico(${i})" style="background:none; border:none;">🗑️</button>
                    </div>
                    <div style="font-size: 0.8em; color: #666;">Recebido por: ${p.quem}</div>
                    <div style="display: ${display}; margin-top: 10px; padding: 10px; background: #eee; border-radius: 4px; width: 95%; white-space: pre-wrap;">${p.detalhes}</div>
                    <button onclick="toggleDetalhe(${i})" style="background:none; border:none; color:#007bff; cursor:pointer; font-weight:bold; padding: 5px 0;">${btnTxt}</button>
                </div>`;
            });
        }
        function toggleDetalhe(i) { db.historicoEntregas[i].expandido = !db.historicoEntregas[i].expandido; renderHistorico(); }
        function delHistorico(i) { if(confirm("Excluir?")) { db.historicoEntregas.splice(i,1); salvar(); renderHistorico(); } }

        // AJUSTES E AUXILIARES
        function carregarAjustes() {
            const p = db.perfis[logado];
            document.getElementById('cfgFoto').value = p.foto;
        }
        function salvarFoto() { db.perfis[logado].foto = document.getElementById('cfgFoto').value; salvar(); atualizarMiniAvatar(); alert("Foto salva!"); }
        function atualizarMiniAvatar() {
            const foto = db.perfis[logado].foto;
            const mini = document.getElementById('mini-avatar');
            mini.style.backgroundImage = foto ? `url('${foto}')` : "none";
            mini.innerText = foto ? "" : logado[0];
        }
        function salvarCores() { 
            db.perfis[logado].cores.bg = document.getElementById('cfgBg').value; 
            db.perfis[logado].cores.card = document.getElementById('cfgCard').value; 
            salvar(); aplicarCores(); 
        }
        function aplicarCores() { 
            const c = db.perfis[logado].cores; 
            document.body.style.backgroundColor = c.bg; 
            document.documentElement.style.setProperty('--bg-container', c.card); 
        }
        function exportarDados() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const a = document.createElement('a'); a.setAttribute("href", dataStr); a.setAttribute("download", "backup.json"); a.click();
        }
        function importarDados(input) {
            const r = new FileReader();
            r.onload = function(){ db = JSON.parse(r.result); salvar(); location.reload(); };
            r.readAsText(input.files[0]);
        }
        function zerarDados() { if(confirm("Zerar gastos?")) { db.perfis[logado].meta = 0; db.perfis[logado].gastos = 0; salvar(); renderFinanceiro(); } }
        function salvar() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
        window.onload = renderPerfis;
    </script>
</body>
</html>
