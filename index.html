
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Inteligente</title>
    <style>
        :root { --bg-body: #141414; --bg-container: #ffffff; --cor-texto: #333333; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-body); color: white; margin: 0; }
        .container { max-width: 480px; margin: 20px auto; background: var(--bg-container); padding: 20px; border-radius: 12px; color: var(--cor-texto); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #interface-principal { display: none; }
        .navbar { display: flex; justify-content: space-around; padding: 15px; background: #000; position: sticky; top: 0; z-index: 100; }
        .navbar button { background: none; border: none; color: #888; font-weight: bold; cursor: pointer; }
        .navbar button.active { color: white; border-bottom: 2px solid white; }
        section { display: none; }
        section.active { display: block; }
        input, select { padding: 12px; width: 100%; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button.btn-acao { padding: 12px; background: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .card-pedido { background: #f9f9f9; padding: 15px; border-radius: 8px; margin: 10px 0; border-left: 5px solid #f39c12; }
        .sugestao-card { background: #e3f2fd; border: 1px dashed #2196f3; padding: 10px; border-radius: 8px; margin-top: 10px; color: #0d47a1; }
        .badge { background: #27ae60; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; }
    </style>
</head>
<body>

    <div id="tela-perfis" style="text-align:center; padding-top:100px;">
        <h1>Quem está usando?</h1>
        <button class="btn-acao" style="width:150px" onclick="entrar('Brena')">Brena</button>
        <button class="btn-acao" style="width:150px" onclick="entrar('Yara')">Yara</button>
    </div>

    <div id="interface-principal">
        <nav class="navbar">
            <button id="nav-pedidos" onclick="aba('pedidos')">HISTÓRICO</button>
            <button id="nav-inventario" onclick="aba('inventario')">📦 INVENTÁRIO</button>
            <button id="nav-ajustes" onclick="aba('ajustes')">AJUSTES</button>
        </nav>

        <section id="pedidos" class="container">
            <h2>Pedidos Realizados</h2>
            <div id="listaHistorico"></div>
        </section>

        <section id="inventario" class="container">
            <h2>📦 O que pedir hoje?</h2>
            <p style="font-size: 0.8em; color: #666;">Escolha a empresa para ver o que você pediu da última vez e quanto deve pedir agora.</p>
            
            <select id="selEmpresaInv" onchange="gerarSugestao()">
                <option value="">Selecione a Empresa...</option>
            </select>

            <div id="areaSugestao">
                </div>
            
            <hr>
            <button class="btn-acao" style="background:#f39c12" onclick="abrirNovoPedido()">+ Registrar Novo Pedido Chegando</button>
        </section>

        <section id="novo-pedido" class="container">
            <button onclick="aba('inventario')" style="border:none; background:none; color:blue; cursor:pointer;">← Cancelar</button>
            <h3>Novo Pedido de <span id="nomeEmpresaNovo"></span></h3>
            <div id="inputsProdutos">
                <input type="text" id="pNome" placeholder="Produto (ex: Coca 2L)">
                <input type="number" id="pQtd" placeholder="Quantidade Comprada">
                <button class="btn-acao" style="background:#444" onclick="addItem()">Adicionar na Lista</button>
            </div>
            <div id="listaTemp" style="margin: 15px 0; color: #333;"></div>
            <button class="btn-acao" style="background:#27ae60" onclick="finalizarPedido()">Salvar e Finalizar</button>
        </section>

        <section id="ajustes" class="container">
            <h3>🏢 Cadastrar Empresas</h3>
            <input type="text" id="newEmp" placeholder="Nome da Empresa">
            <button class="btn-acao" onclick="addEmp()">Salvar Empresa</button>
        </section>
    </div>

    <script>
        let logado = "";
        let listaTemp = [];
        let db = JSON.parse(localStorage.getItem('mega_gestao')) || {
            empresas: ["Coca-Cola", "Ambev"],
            pedidos: [] // [{empresa: '', data: '', itens: [{nome: '', un: 0}]}]
        };

        function entrar(n) { 
            logado = n; 
            document.getElementById('tela-perfis').style.display='none'; 
            document.getElementById('interface-principal').style.display='block'; 
            aba('inventario');
        }

        function aba(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'inventario') { popularSelects(); renderSugestaoVazia(); }
            if(id === 'pedidos') renderHistorico();
        }

        function popularSelects() {
            const sel = document.getElementById('selEmpresaInv');
            sel.innerHTML = '<option value="">Selecione a Empresa...</option>';
            db.empresas.forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
        }

        function gerarSugestao() {
            const empresa = document.getElementById('selEmpresaInv').value;
            const area = document.getElementById('areaSugestao');
            if(!empresa) return area.innerHTML = "";

            // Acha o último pedido dessa empresa
            const ultimo = db.pedidos.find(p => p.empresa === empresa);

            if(!ultimo) {
                area.innerHTML = "<p>Nenhum pedido anterior desta empresa encontrado.</p>";
                return;
            }

            let html = `<div class="sugestao-card">
                <strong>Último Pedido em: ${ultimo.data}</strong><br><br>`;
            
            ultimo.itens.forEach((it, idx) => {
                html += `
                <div style="margin-bottom:15px; border-bottom:1px solid #ccc; padding-bottom:10px;">
                    <span>${it.nome} (Comprou: ${it.un})</span><br>
                    <input type="number" placeholder="Quanto tem hoje?" 
                        id="hoje_${idx}" 
                        oninput="calcularFalta(${it.un}, this.value, 'falta_${idx}')"
                        style="width:80%; font-size:0.8em; padding:5px;">
                    <div style="font-weight:bold; color:#e50914" id="falta_${idx}">Pedir: 0</div>
                </div>`;
            });

            html += `</div>`;
            area.innerHTML = html;
        }

        function calcularFalta(comprou, temHoje, idAlvo) {
            let falta = comprou - (parseInt(temHoje) || 0);
            if (falta < 0) falta = 0;
            document.getElementById(idAlvo).innerText = "Pedir: " + falta;
        }

        function abrirNovoPedido() {
            const emp = document.getElementById('selEmpresaInv').value;
            if(!emp) return alert("Selecione a empresa primeiro!");
            document.getElementById('nomeEmpresaNovo').innerText = emp;
            listaTemp = [];
            document.getElementById('listaTemp').innerHTML = "";
            aba('novo-pedido');
        }

        function addItem() {
            const n = document.getElementById('pNome').value;
            const q = parseInt(document.getElementById('pQtd').value);
            if(n && q) {
                listaTemp.push({nome: n, un: q});
                document.getElementById('pNome').value = "";
                document.getElementById('pQtd').value = "";
                renderTemp();
            }
        }

        function renderTemp() {
            const div = document.getElementById('listaTemp');
            div.innerHTML = listaTemp.map(i => `<div>• ${i.nome}: ${i.un} un</div>`).join("");
        }

        function finalizarPedido() {
            const emp = document.getElementById('selEmpresaInv').value;
            const novo = {
                empresa: emp,
                data: new Date().toLocaleDateString('pt-BR'),
                itens: listaTemp,
                quem: logado
            };
            db.pedidos.unshift(novo); // Coloca no início
            salvar();
            alert("Pedido salvo com sucesso!");
            aba('inventario');
        }

        function renderHistorico() {
            const div = document.getElementById('listaHistorico');
            div.innerHTML = db.pedidos.map(p => `
                <div class="card-pedido">
                    <div style="display:flex; justify-content:space-between">
                        <b>${p.empresa}</b> <span class="badge">${p.data}</span>
                    </div>
                    <div style="font-size:0.8em; margin-top:5px; color:#555">
                        ${p.itens.map(i => `${i.nome} (${i.un})`).join(", ")}
                    </div>
                </div>
            `).join("");
        }

        function renderSugestaoVazia() { document.getElementById('areaSugestao').innerHTML = ""; }
        function addEmp() { const e = document.getElementById('newEmp').value; if(e) { db.empresas.push(e); salvar(); alert("OK"); aba('inventario'); } }
        function salvar() { localStorage.setItem('mega_gestao', JSON.stringify(db)); }
    </script>
</body>
</html>
