<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador Premium</title>
    <style>
        :root {
            --bg-body: #141414;
            --bg-container: #ffffff;
            --cor-texto: #333333;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-body); 
            color: white; margin: 0; transition: 0.4s;
        }

        /* --- TELA DE PERFIS --- */
        #tela-perfis {
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        .perfis-container { display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        .perfil-card { cursor: pointer; text-align: center; width: 120px; transition: 0.3s; }
        .perfil-card:hover { transform: scale(1.1); }
        
        .avatar {
            width: 120px; height: 120px; border-radius: 8px;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            border: 3px solid transparent; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 40px;
            background-color: #333; color: white;
        }

        /* --- INTERFACE PRINCIPAL --- */
        #interface-principal { display: none; }
        .btn-voltar { background: #333; color: white; border: none; padding: 10px 15px; cursor: pointer; margin: 10px; border-radius: 5px; font-weight: bold; }
        
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: rgba(0,0,0,0.9);
            position: sticky; top: 0; z-index: 100;
        }
        .nav-links button {
            background: none; border: none; color: #aaa; margin-left: 15px;
            cursor: pointer; font-size: 1em; font-weight: bold;
        }
        .nav-links button.active { color: white; border-bottom: 2px solid #e50914; }

        .container {
            max-width: 480px; margin: 30px auto; background: var(--bg-container);
            padding: 25px; border-radius: 12px; color: var(--cor-texto);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        section { display: none; }
        section.active { display: block; }

        input, select { padding: 12px; width: 100%; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button.btn-acao { 
            padding: 12px; background: #e50914; color: white; 
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;
        }

        /* --- PEDIDOS --- */
        .sugestao-box, .historico-card { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; color: #333; }
        .sub-item { font-size: 0.9em; padding: 5px; border-bottom: 1px dashed #ccc; display: flex; justify-content: space-between; }
        
        /* --- CORES --- */
        .quadrado-cor { width: 45px; height: 45px; border-radius: 6px; border: 2px solid #ddd; cursor: pointer; position: relative; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 10px; }
        .quadrado-cor input[type="color"] { position: absolute; top: -10px; left: -10px; width: 70px; height: 70px; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <div id="tela-perfis">
        <h1>Quem está usando?</h1>
        <div class="perfis-container" id="lista-avatars"></div>
    </div>

    <div id="interface-principal">
        <button class="btn-voltar" onclick="location.reload()">← Trocar Usuário</button>
        
        <nav class="navbar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div id="mini-avatar" style="width:45px; height:45px; border-radius:50%; background-size:cover; background-position:center; background-color:#444;"></div>
                <h2 id="user-display" style="margin:0"></h2>
            </div>
            <div class="nav-links">
                <button id="btn-aba-gastos" onclick="aba('gastos')">Gastos</button>
                <button id="btn-aba-pedidos" onclick="aba('pedidos')">Pedidos</button>
                <button id="btn-aba-ajustes" onclick="aba('ajustes')">Ajustes</button>
            </div>
        </nav>

        <section id="gastos" class="container">
            <h2>Meus Gastos</h2>
            <div id="financeiro-ok" style="display:none;">
                <p style="font-weight: bold; color: #666;">Meta Mensal: R$ <span id="valMeta">0</span></p>
                <input type="number" id="inGasto" placeholder="Valor do gasto (ex: 50.00)">
                <button class="btn-acao" onclick="addGasto()">Registrar Gasto</button>
                
                <div style="margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px;">
                    <p style="margin: 5px 0;">Total Gasto: <span id="totalG" style="font-weight: bold;">R$ 0,00</span></p>
                    <p style="margin: 5px 0;">Ainda Resta: <b id="restaG" style="color: #27ae60;">R$ 0,00</b></p>
                </div>
                <button class="btn-acao" style="background: #999; font-size: 0.8em; margin-top: 20px;" onclick="resetarMetaLocal()">Alterar Meta</button>
            </div>

            <div id="financeiro-setup" style="display:none;">
                <p>Você ainda não definiu uma meta para este perfil.</p>
                <input type="number" id="inMeta" placeholder="Qual sua meta de gastos?">
                <button class="btn-acao" onclick="setMeta()">Salvar Minha Meta</button>
            </div>
        </section>

        <section id="pedidos" class="container">
            <h2>📦 Pedidos</h2>
            <select id="selEmpresa" onchange="gerarSugestao()">
                <option value="">Selecione a Empresa...</option>
            </select>
            <div id="areaSugestao"></div>
            <button class="btn-acao" style="background:#f39c12" onclick="toggleNovoPedido()">+ Adicionar Pedido Feito</button>
            
            <div id="view-novo-pedido" style="display:none; margin-top:20px; border-top:1px solid #eee; padding-top:10px;">
                <input type="text" id="pProdNome" placeholder="Produto">
                <input type="number" id="pProdUn" placeholder="Quantidade">
                <button class="btn-acao" style="background:#444" onclick="addItemTemp()">+ Incluir Item</button>
                <div id="listaTemp" style="margin:10px 0"></div>
                <button class="btn-acao" style="background:#27ae60" onclick="salvarPedidoFinal()">Salvar e Gerar Histórico</button>
            </div>
            <hr style="margin:20px 0; opacity:0.1">
            <h3>📜 Últimos Pedidos</h3>
            <div id="listaHistorico"></div>
        </section>

        <section id="ajustes" class="container">
            <h2>Ajustes</h2>
            <label>Nome do Perfil:</label>
            <input type="text" id="cfgNome">
            <button class="btn-acao" style="background:#007bff" onclick="trocarNome()">Salvar Novo Nome</button>
            <hr>
            <label>Foto (Link da Imagem):</label>
            <input type="text" id="cfgFoto" placeholder="Cole a URL da imagem aqui">
            <button class="btn-acao" style="background:#444" onclick="salvarFoto()">Atualizar Foto</button>
            <hr>
            <label>Cores do App:</label>
            <div style="margin: 15px 0;">
                Fundo: <div class="quadrado-cor" id="previewBg"><input type="color" id="cfgBg" oninput="previewCor()"></div>
                Card: <div class="quadrado-cor" id="previewCard"><input type="color" id="cfgCard" oninput="previewCor()"></div>
            </div>
            <button class="btn-acao" onclick="salvarCores()">Aplicar Cores</button>
            <hr>
            <label>Gerenciar Empresas:</label>
            <input type="text" id="newEmpresa" placeholder="Nome da empresa">
            <button class="btn-acao" style="background:#2ecc71" onclick="addEmpresa()">Cadastrar</button>
            <button class="btn-acao" style="background:#666; margin-top:40px" onclick="zerarTudo()">Limpar Tudo deste Perfil</button>
        </section>
    </div>

    <script>
        let logado = "";
        let listaTemp = [];
        const DB_KEY = 'casa_premium_v7';

        let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
            perfis: {
                "Brena": { meta: 0, gastos: 0, foto: "", cores: { bg: "#141414", card: "#ffffff" } },
                "Yara": { meta: 0, gastos: 0, foto: "", cores: { bg: "#141414", card: "#ffffff" } },
                "Nathalia": { meta: 0, gastos: 0, foto: "", cores: { bg: "#141414", card: "#ffffff" } }
            },
            empresas: ["Coca-Cola"],
            pedidosPadrao: {},
            historico: []
        };

        function renderPerfis() {
            const container = document.getElementById('lista-avatars');
            container.innerHTML = "";
            Object.keys(db.perfis).forEach(p => {
                const foto = db.perfis[p].foto;
                container.innerHTML += `<div class="perfil-card" onclick="entrar('${p}')"><div class="avatar" style="background-image: url('${foto}')">${foto?'':p[0]}</div><b>${p}</b></div>`;
            });
        }

        function entrar(nome) {
            logado = nome;
            document.getElementById('tela-perfis').style.display = 'none';
            document.getElementById('interface-principal').style.display = 'block';
            document.getElementById('user-display').innerText = nome;
            aplicarCores(); 
            atualizarMiniAvatar(); 
            aba('gastos'); // Isso já chama o renderFinanceiro()
        }

        function aba(nomeAba) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(nomeAba).classList.add('active');
            document.getElementById('btn-aba-' + nomeAba).classList.add('active');

            if(nomeAba === 'gastos') renderFinanceiro();
            if(nomeAba === 'pedidos') { popularEmpresas(); renderHistorico(); }
            if(nomeAba === 'ajustes') carregarAjustes();
        }

        // --- LÓGICA DE GASTOS (CORRIGIDA) ---
        function renderFinanceiro() {
            const p = db.perfis[logado];
            const areaOk = document.getElementById('financeiro-ok');
            const areaSetup = document.getElementById('financeiro-setup');

            if (!p.meta || p.meta <= 0) {
                areaOk.style.display = 'none';
                areaSetup.style.display = 'block';
            } else {
                areaOk.style.display = 'block';
                areaSetup.style.display = 'none';
                
                document.getElementById('valMeta').innerText = p.meta.toFixed(2);
                document.getElementById('totalG').innerText = "R$ " + p.gastos.toFixed(2);
                
                let restante = p.meta - p.gastos;
                const fieldResta = document.getElementById('restaG');
                fieldResta.innerText = "R$ " + restante.toFixed(2);
                fieldResta.style.color = restante < 0 ? "#e50914" : "#27ae60";
            }
        }

        function setMeta() {
            const m = parseFloat(document.getElementById('inMeta').value);
            if(m > 0) {
                db.perfis[logado].meta = m;
                salvar();
                renderFinanceiro();
            } else {
                alert("Insira um valor de meta válido!");
            }
        }

        function addGasto() {
            const v = parseFloat(document.getElementById('inGasto').value);
            if(v > 0) {
                db.perfis[logado].gastos += v;
                salvar();
                renderFinanceiro();
                document.getElementById('inGasto').value = '';
            }
        }

        function resetarMetaLocal() {
            if(confirm("Deseja alterar sua meta mensal?")) {
                db.perfis[logado].meta = 0;
                salvar();
                renderFinanceiro();
            }
        }

        // --- RESTANTE DAS FUNÇÕES ---
        function popularEmpresas() {
            const sel = document.getElementById('selEmpresa');
            sel.innerHTML = '<option value="">Selecione a Empresa...</option>';
            db.empresas.forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
        }

        function toggleNovoPedido() {
            const view = document.getElementById('view-novo-pedido');
            view.style.display = view.style.display === 'none' ? 'block' : 'none';
        }

        function addItemTemp() {
            const n = document.getElementById('pProdNome').value;
            const u = document.getElementById('pProdUn').value;
            if(n && u) {
                listaTemp.push({nome: n, un: parseInt(u)});
                document.getElementById('pProdNome').value = ""; document.getElementById('pProdUn').value = "";
                renderTemp();
            }
        }

        function renderTemp() {
            document.getElementById('listaTemp').innerHTML = listaTemp.map(i => `<div class="sub-item">${i.nome} <span>${i.un} un</span></div>`).join("");
        }

        function salvarPedidoFinal() {
            const emp = document.getElementById('selEmpresa').value;
            if(!emp || listaTemp.length === 0) return alert("Preencha a empresa e os itens!");
            db.historico.unshift({ empresa: emp, itens: [...listaTemp], data: new Date().toLocaleDateString('pt-BR') });
            db.pedidosPadrao[emp] = [...listaTemp];
            listaTemp = []; salvar(); toggleNovoPedido(); renderHistorico(); gerarSugestao();
        }

        function renderHistorico() {
            document.getElementById('listaHistorico').innerHTML = db.historico.slice(0, 5).map(p => `
                <div class="historico-card">
                    <div style="display:flex; justify-content:space-between"><b>${p.empresa}</b> <small>${p.data}</small></div>
                    <div style="font-size:0.85em; color:#555; margin-top:5px">${p.itens.map(i => i.nome + " ("+i.un+")").join(", ")}</div>
                </div>`).join("");
        }

        function gerarSugestao() {
            const emp = document.getElementById('selEmpresa').value;
            const area = document.getElementById('areaSugestao');
            if(!emp || !db.pedidosPadrao[emp]) { area.innerHTML = ""; return; }
            let html = `<div class="sugestao-box"><strong>Sugestão baseada no último pedido:</strong><br><br>`;
            db.pedidosPadrao[emp].forEach((it, idx) => {
                html += `<div style="margin-bottom:8px"><small>${it.nome} (${it.un})</small><br><input type="number" placeholder="Tem?" oninput="document.getElementById('res_${idx}').innerText = Math.max(0, ${it.un} - this.value)" style="padding:5px; width:70px"> <span style="color:#e50914; font-weight:bold">Pedir: <span id="res_${idx}">0</span></span></div>`;
            });
            area.innerHTML = html + "</div>";
        }

        function carregarAjustes() {
            const p = db.perfis[logado];
            document.getElementById('cfgNome').value = logado;
            document.getElementById('cfgFoto').value = p.foto;
            document.getElementById('cfgBg').value = p.cores.bg;
            document.getElementById('cfgCard').value = p.cores.card;
            previewCor();
        }

        function previewCor() {
            document.getElementById('previewBg').style.backgroundColor = document.getElementById('cfgBg').value;
            document.getElementById('previewCard').style.backgroundColor = document.getElementById('cfgCard').value;
        }

        function salvarCores() {
            db.perfis[logado].cores.bg = document.getElementById('cfgBg').value;
            db.perfis[logado].cores.card = document.getElementById('cfgCard').value;
            salvar(); aplicarCores(); alert("Cores aplicadas!");
        }

        function aplicarCores() {
            const c = db.perfis[logado].cores;
            document.body.style.backgroundColor = c.bg;
            document.documentElement.style.setProperty('--bg-container', c.card);
        }

        function salvarFoto() { db.perfis[logado].foto = document.getElementById('cfgFoto').value; salvar(); atualizarMiniAvatar(); alert("Foto atualizada!"); }
        
        function atualizarMiniAvatar() {
            const f = db.perfis[logado].foto;
            const m = document.getElementById('mini-avatar');
            m.style.backgroundImage = f ? `url('${f}')` : "none";
            m.innerText = f ? "" : logado[0];
        }

        function trocarNome() { 
            const n = document.getElementById('cfgNome').value.trim(); 
            if(n && n !== logado) { 
                db.perfis[n] = db.perfis[logado]; 
                delete db.perfis[logado]; 
                salvar(); 
                location.reload(); 
            } 
        }

        function addEmpresa() { 
            const e = document.getElementById('newEmpresa').value.trim(); 
            if(e) { db.empresas.push(e); salvar(); popularEmpresas(); alert("Empresa cadastrada!"); } 
        }

        function zerarTudo() { 
            if(confirm("Isso apagará seus gastos e sua meta. Continuar?")) { 
                db.perfis[logado].gastos = 0; 
                db.perfis[logado].meta = 0; 
                salvar(); 
                renderFinanceiro(); 
            } 
        }

        function salvar() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
        window.onload = renderPerfis;
    </script>
</body>
</html>
